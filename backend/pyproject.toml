[project]
name = "talentflow-backend"
version = "0.1.0"
description = "TalentFlow AI API: recruitment platform with explainable matching and vacancy-specific CV optimization"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["B008", "E501", "RUF001", "RUF002", "RUF003", "UP046", "UP047"]  # Depends() defaults; Dutch text uses typographic characters

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E", "F", "I", "UP", "RUF"]
